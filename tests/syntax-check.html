<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pixel Grid — Module Load Check</title>
  <style>body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial; padding:20px} pre{white-space:pre-wrap; background:#f6f8fa; padding:12px; border-radius:6px; border:1px solid #e1e4e8}</style>
</head>
<body>
  <h2>Module Load & Syntax Check</h2>
  <p>This page dynamically imports the app's modules and reports load errors. Serve the project over HTTP (see tests/README.md).</p>
  <pre id="out">Starting checks...
</pre>

  <script type="module">
    const out = document.getElementById('out');
    function log(s){ out.textContent += s + '\n'; }

    async function test(path){
      try{
        await import(path);
        log(`OK: ${path}`);
      } catch(e){
        log(`ERROR: ${path} -> ${e.message}`);
        console.error(`Module import error for ${path}:`, e);
      }
    }

    const modules = [
      '/scripts/colors.js',
      '/scripts/pixel-animation.js',
      '/scripts/render.js',
      '/scripts/exports.js',
      '/scripts/settings.js',
      '/scripts/counter.js',
      '/scripts/main.js'
    ];

    (async ()=>{
      for(const m of modules){
        await test(m);
      }
      log('\nDone. Check the browser console for full stack traces.');
    })();
  </script>
</body>
</html>
